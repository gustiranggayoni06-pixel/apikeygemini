<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI Gemini</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h2 {
            margin-top: 0;
            color: #1a73e8;
            text-align: center;
        }
        .input-group {
            margin-bottom: 10px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f8f9fa;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .user-message {
            align-self: flex-end;
            background-color: #1a73e8;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .model-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            height: 50px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Chat Gemini AI</h2>

    <!-- Input API Key yang Aman -->
    <div class="input-group">
        <input type="password" id="apiKey" placeholder="Masukkan API Key Gemini Baru..." onchange="saveApiKey()" />
    </div>
    
    <!-- Area Chat -->
    <div id="chatBox" class="chat-box">
        <div class="message model-message">Halo! Ada yang bisa saya bantu hari ini?</div>
    </div>

    <!-- Area Input Pesan -->
    <div class="input-area">
        <textarea id="prompt" placeholder="Tulis pesan..."></textarea>
        <button id="submitBtn" onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
const chatHistory = [];

// Otomatis isi API Key jika pernah disimpan sebelumnya
window.onload = function() {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
    }
};

function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('gemini_api_key', key);
}

async function sendMessage() {
    let apiKey = document.getElementById('apiKey').value.trim();
    const promptInput = document.getElementById('prompt');
    const promptText = promptInput.value.trim();
    const chatBox = document.getElementById('chatBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!apiKey) {
        alert('Harap masukkan API Key Gemini Anda pada kolom paling atas!');
        return;
    }

    if (!promptText) return;

    saveApiKey();

    appendMessage(promptText, 'user-message');
    promptInput.value = '';

    chatHistory.push({
        role: "user",
        parts: [{ text: promptText }]
    });

    const loadingDiv = appendMessage('Memproses jawaban...', 'model-message');
    submitBtn.disabled = true;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: chatHistory
            })
        });

        const data = await response.json();

        if (response.ok) {
            const botResponse = data.candidates[0].content.parts[0].text;
            loadingDiv.innerText = botResponse;

            chatHistory.push({
                role: "model",
                parts: [{ text: botResponse }]
            });
        } else {
            loadingDiv.innerText = `Error: ${data.error ? data.error.message : 'Gagal terhubung ke API'}`;
            chatHistory.pop();
        }
    } catch (error) {
        loadingDiv.innerText = `Terjadi kesalahan koneksi: ${error.message}`;
        chatHistory.pop();
    } finally {
        submitBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

function appendMessage(text, className) {
    const chatBox = document.getElementById('chatBox');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${className}`;
    messageDiv.innerText = text;
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return messageDiv;
}

document.getElementById('prompt').addEventListener('keypress', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
