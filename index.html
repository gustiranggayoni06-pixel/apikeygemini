<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI Gemini</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h2 {
            margin-top: 0;
            color: #1a73e8;
            text-align: center;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f8f9fa;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .user-message {
            align-self: flex-end;
            background-color: #1a73e8;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .model-message {
            align-self: flex-start;
            background-color: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            height: 50px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Chat Gemini AI</h2>
    
    <!-- Area Riwayat Percakapan -->
    <div id="chatBox" class="chat-box">
        <div class="message model-message">Halo! Ada yang bisa saya bantu hari ini?</div>
    </div>

    <!-- Area Input Pesan -->
    <div class="input-area">
        <textarea id="prompt" placeholder="Tulis pesan..."></textarea>
        <button id="submitBtn" onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
// ==========================================
// PASTE API KEY GEMINI ANDA DI BAWAH INI
// ==========================================
const API_KEY = "AQ.Ab8RN6IPSF2MZGSpjkhGuEvHjk1Dc1dawSJE5mUPdyaWc3gCLQ"; 

// Array untuk menyimpan riwayat percakapan
const chatHistory = [];

async function sendMessage() {
    const promptInput = document.getElementById('prompt');
    const promptText = promptInput.value.trim();
    const chatBox = document.getElementById('chatBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!promptText) return;

    if (API_KEY === "ISI_API_KEY_ANDA_DI_SINI" || !API_KEY) {
        alert('Harap isi variabel API_KEY dalam kodingan JavaScript terlebih dahulu!');
        return;
    }

    // 1. Tampilkan pesan User ke layar
    appendMessage(promptText, 'user-message');
    promptInput.value = '';

    // 2. Tambahkan pesan User ke riwayat percakapan API
    chatHistory.push({
        role: "user",
        parts: [{ text: promptText }]
    });

    // 3. Tampilkan indikator loading
    const loadingDiv = appendMessage('Memproses jawaban...', 'model-message');
    submitBtn.disabled = true;

    // Endpoint API Gemini
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: chatHistory // Mengirimkan seluruh riwayat obrolan
            })
        });

        const data = await response.json();

        if (response.ok) {
            const botResponse = data.candidates[0].content.parts[0].text;
            
            // Perbarui teks loading dengan jawaban asli
            loadingDiv.innerText = botResponse;

            // Simpan jawaban AI ke dalam riwayat percakapan
            chatHistory.push({
                role: "model",
                parts: [{ text: botResponse }]
            });
        } else {
            loadingDiv.innerText = `Error: ${data.error ? data.error.message : 'Gagal terhubung ke API'}`;
            chatHistory.pop(); // Hapus pesan user terakhir dari history jika error
        }
    } catch (error) {
        loadingDiv.innerText = `Terjadi kesalahan koneksi: ${error.message}`;
        chatHistory.pop();
    } finally {
        submitBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}

function appendMessage(text, className) {
    const chatBox = document.getElementById('chatBox');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${className}`;
    messageDiv.innerText = text;
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return messageDiv;
}

// BIsa mengirim pesan dengan menekan Enter
document.getElementById('prompt').addEventListener('keypress', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
